# ============================================================================
# Spark Prometheus Metrics Configuration
# ============================================================================
#
# Purpose:
# Configure Spark's metrics system to expose metrics through a
# Prometheus-compatible HTTP endpoint.
#
# Prometheus will later scrape this endpoint and store the metrics.
#
# Architecture:
#
#     Spark
#       |
#       | Spark Metrics
#       v
# PrometheusServlet
#       |
#       | HTTP /metrics/prometheus
#       v
# Prometheus
#
# ============================================================================


# ----------------------------------------------------------------------------
# Prometheus Servlet
# ----------------------------------------------------------------------------
#
# Tell Spark to use its Prometheus servlet as a metrics sink.
# ----------------------------------------------------------------------------

*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet


# ----------------------------------------------------------------------------
# Metrics endpoint
# ----------------------------------------------------------------------------
#
# Spark exposes the metrics at:
#
#     /metrics/prometheus
#
# The exact host/port will depend on which Spark web interface we attach
# the metrics servlet to in the Docker configuration.
# ----------------------------------------------------------------------------

*.sink.prometheusServlet.path=/metrics/prometheus


# ----------------------------------------------------------------------------
# Metrics refresh interval
# ----------------------------------------------------------------------------
#
# Spark updates the metrics every 10 seconds.
# ----------------------------------------------------------------------------

*.sink.prometheusServlet.period=10


# ----------------------------------------------------------------------------
# Refresh interval unit
# ----------------------------------------------------------------------------

*.sink.prometheusServlet.unit=seconds